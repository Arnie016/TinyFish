// Build edges from relationships
const edges = [];
const edgeSet = new Set();
function addEdge(a, b, type) {
  const key = [a,b].sort().join("::") + "::" + type;
  if (edgeSet.has(key)) return;
  edgeSet.add(key);
  edges.push({ source: a, target: b, type });
}

skills.forEach(s => {
  if (s.rels.complements) s.rels.complements.forEach(t => addEdge(s.id, t, "complement"));
  if (s.rels.sibling) addEdge(s.id, s.rels.sibling, "sibling");
  if (s.rels.shared_core) addEdge(s.id, s.rels.shared_core, "shared-core");
  if (s.rels.provides_core_to) addEdge(s.id, s.rels.provides_core_to, "shared-core");
});

// Launch pipeline edges
const pipeline = ["workspace-doctor","repo-launch","brand-kit","content-pack","website-drop"];
for (let i = 0; i < pipeline.length - 1; i++) addEdge(pipeline[i], pipeline[i+1], "pipeline");

document.getElementById("statEdges").textContent = edges.length;

// ═══════════════════════════════════════════════════════
//  GRAPH ENGINE
// ═══════════════════════════════════════════════════════
const canvas = document.getElementById("graph");
const ctx = canvas.getContext("2d");
let W, H, dpr;

function resize() {
  dpr = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();
window.addEventListener("resize", resize);

// Camera
let camX = 0, camY = 0, camZoom = 1;
let targetCamX = 0, targetCamY = 0, targetCamZoom = 1;

// Nodes
const nodes = skills.map((s, i) => {
  const angle = (i / skills.length) * Math.PI * 2;
  const r = 200 + Math.random() * 100;
  const connCount = edges.filter(e => e.source === s.id || e.target === s.id).length;
  return {
    ...s,
    x: Math.cos(angle) * r + (Math.random() - 0.5) * 80,
    y: Math.sin(angle) * r + (Math.random() - 0.5) * 80,
    vx: 0, vy: 0,
    radius: 22 + connCount * 3,
    connCount,
    highlight: 1,
    pulsePhase: Math.random() * Math.PI * 2
  };
});

const nodeMap = {};
nodes.forEach(n => nodeMap[n.id] = n);

// Physics
const REPULSION = 8000;
const SPRING_K = 0.004;
const SPRING_REST = 180;
const DAMPING = 0.88;
const CENTER_PULL = 0.0005;

function simulate() {
  // Repulsion
  for (let i = 0; i < nodes.length; i++) {
    for (let j = i + 1; j < nodes.length; j++) {
      const a = nodes[i], b = nodes[j];
      let dx = a.x - b.x, dy = a.y - b.y;
      let dist = Math.sqrt(dx * dx + dy * dy) || 1;
      let force = REPULSION / (dist * dist);
      let fx = (dx / dist) * force, fy = (dy / dist) * force;
      a.vx += fx; a.vy += fy;
      b.vx -= fx; b.vy -= fy;
    }
  }
  // Springs (edges)
  edges.forEach(e => {
    const a = nodeMap[e.source], b = nodeMap[e.target];
    if (!a || !b) return;
    let dx = b.x - a.x, dy = b.y - a.y;
    let dist = Math.sqrt(dx * dx + dy * dy) || 1;
    let force = SPRING_K * (dist - SPRING_REST);
    let fx = (dx / dist) * force, fy = (dy / dist) * force;
    a.vx += fx; a.vy += fy;
    b.vx -= fx; b.vy -= fy;
  });
  // Center gravity
  nodes.forEach(n => {
    n.vx -= n.x * CENTER_PULL;
    n.vy -= n.y * CENTER_PULL;
  });
  // Integrate
  nodes.forEach(n => {
    if (n === dragNode) return;
    n.vx *= DAMPING;
    n.vy *= DAMPING;
    n.x += n.vx;
    n.y += n.vy;
  });
}

// ═══════════════════════════════════════════════════════
//  PARTICLES
// ═══════════════════════════════════════════════════════
const particles = [];
const MAX_PARTICLES = 300;

function spawnEdgeParticles() {
  edges.forEach(e => {
    const a = nodeMap[e.source], b = nodeMap[e.target];
    if (!a || !b) return;
    if (a.highlight < 0.3 && b.highlight < 0.3) return;
    if (Math.random() > 0.02) return;
    if (particles.length >= MAX_PARTICLES) return;
    const t = Math.random();
    particles.push({
      x: a.x + (b.x - a.x) * t,
      y: a.y + (b.y - a.y) * t,
      vx: (Math.random() - 0.5) * 0.3,
      vy: (Math.random() - 0.5) * 0.3,
      life: 1,
      decay: 0.008 + Math.random() * 0.012,
      size: 1 + Math.random() * 1.5,
      color: CATEGORY_COLORS[a.category] || "#7C3AED"
    });
  });
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life -= p.decay;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

// ═══════════════════════════════════════════════════════
//  BACKGROUND STARS
// ═══════════════════════════════════════════════════════
const stars = Array.from({ length: 200 }, () => ({
  x: (Math.random() - 0.5) * 3000,
  y: (Math.random() - 0.5) * 3000,
  size: 0.3 + Math.random() * 1.2,
  alpha: 0.1 + Math.random() * 0.4,
  twinkleSpeed: 0.002 + Math.random() * 0.005
}));

// ═══════════════════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════════════════
let hoveredNode = null;
let selectedNode = null;
let time = 0;

const EDGE_COLORS = {
  complement: "rgba(124,58,237,0.12)",
  sibling: "rgba(245,158,11,0.25)",
  pipeline: "rgba(59,130,246,0.2)",
  "shared-core": "rgba(236,72,153,0.2)"
};
const EDGE_HIGHLIGHT_COLORS = {
  complement: "rgba(124,58,237,0.5)",
  sibling: "rgba(245,158,11,0.7)",
  pipeline: "rgba(59,130,246,0.6)",
  "shared-core": "rgba(236,72,153,0.6)"
};

function worldToScreen(x, y) {
  return { x: (x - camX) * camZoom + W / 2, y: (y - camY) * camZoom + H / 2 };
}
function screenToWorld(sx, sy) {
  return { x: (sx - W / 2) / camZoom + camX, y: (sy - H / 2) / camZoom + camY };
}

function draw() {
  time++;
  ctx.clearRect(0, 0, W, H);

  // Smooth camera
  camX += (targetCamX - camX) * 0.08;
  camY += (targetCamY - camY) * 0.08;
  camZoom += (targetCamZoom - camZoom) * 0.08;

  // Background gradient
  const bgGrad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, W * 0.7);
  bgGrad.addColorStop(0, "#0e0e18");
  bgGrad.addColorStop(1, "#08080c");
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  // Stars
  stars.forEach(s => {
    const sp = worldToScreen(s.x, s.y);
    const twinkle = Math.sin(time * s.twinkleSpeed) * 0.3 + 0.7;
    ctx.globalAlpha = s.alpha * twinkle;
    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(sp.x, sp.y, s.size * camZoom * 0.3, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  // Edges
  edges.forEach(e => {
    const a = nodeMap[e.source], b = nodeMap[e.target];
    if (!a || !b) return;
    const sa = worldToScreen(a.x, a.y), sb = worldToScreen(b.x, b.y);
    const isConnected = selectedNode && (e.source === selectedNode.id || e.target === selectedNode.id);
    const isHoverConnected = hoveredNode && (e.source === hoveredNode.id || e.target === hoveredNode.id);

    ctx.beginPath();
    ctx.moveTo(sa.x, sa.y);

    // Curved edges
    const mx = (sa.x + sb.x) / 2 + (sa.y - sb.y) * 0.08;
    const my = (sa.y + sb.y) / 2 + (sb.x - sa.x) * 0.08;
    ctx.quadraticCurveTo(mx, my, sb.x, sb.y);

    if (e.type === "sibling" || e.type === "shared-core") {
      ctx.setLineDash([6, 4]);
    } else {
      ctx.setLineDash([]);
    }

    if (isConnected || isHoverConnected) {
      ctx.strokeStyle = EDGE_HIGHLIGHT_COLORS[e.type] || "rgba(124,58,237,0.5)";
      ctx.lineWidth = 2.5;
    } else {
      ctx.strokeStyle = EDGE_COLORS[e.type] || "rgba(124,58,237,0.12)";
      ctx.lineWidth = 1.2;
    }
    ctx.stroke();
    ctx.setLineDash([]);

    // Arrow for pipeline
    if (e.type === "pipeline") {
      const angle = Math.atan2(sb.y - my, sb.x - mx);
      const arrowLen = 8 * camZoom;
      ctx.fillStyle = isConnected ? "rgba(59,130,246,0.7)" : "rgba(59,130,246,0.25)";
      ctx.beginPath();
      ctx.moveTo(sb.x - a.radius * camZoom * Math.cos(angle), sb.y - a.radius * camZoom * Math.sin(angle));
      ctx.lineTo(sb.x - (a.radius * camZoom + arrowLen) * Math.cos(angle - 0.4), sb.y - (a.radius * camZoom + arrowLen) * Math.sin(angle - 0.4));
      ctx.lineTo(sb.x - (a.radius * camZoom + arrowLen) * Math.cos(angle + 0.4), sb.y - (a.radius * camZoom + arrowLen) * Math.sin(angle + 0.4));
      ctx.closePath();
      ctx.fill();
    }
  });

  // Particles
  particles.forEach(p => {
    const sp = worldToScreen(p.x, p.y);
    ctx.globalAlpha = p.life * 0.6;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(sp.x, sp.y, p.size * camZoom, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  // Nodes
  nodes.forEach(n => {
    const sp = worldToScreen(n.x, n.y);
    const r = n.radius * camZoom;
    const catColor = CATEGORY_COLORS[n.category] || "#7C3AED";
    const isSelected = selectedNode && selectedNode.id === n.id;
    const isHovered = hoveredNode && hoveredNode.id === n.id;
    const isConnectedToSelected = selectedNode && edges.some(e =>
      (e.source === selectedNode.id && e.target === n.id) ||
      (e.target === selectedNode.id && e.source === n.id)
    );

    let alpha = n.highlight;
    if (selectedNode && !isSelected && !isConnectedToSelected) alpha = 0.15;

    // Outer glow
    const pulse = Math.sin(time * 0.03 + n.pulsePhase) * 0.3 + 0.7;
    const glowR = r * (1.8 + (isSelected ? 0.5 : 0) + (isHovered ? 0.3 : 0));
    const glow = ctx.createRadialGradient(sp.x, sp.y, r * 0.5, sp.x, sp.y, glowR);
    glow.addColorStop(0, catColor + Math.round(alpha * pulse * 40).toString(16).padStart(2, '0'));
    glow.addColorStop(1, catColor + "00");
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(sp.x, sp.y, glowR, 0, Math.PI * 2);
    ctx.fill();

    // Node circle
    ctx.globalAlpha = alpha;
    const grad = ctx.createRadialGradient(sp.x - r * 0.3, sp.y - r * 0.3, 0, sp.x, sp.y, r);
    grad.addColorStop(0, lightenColor(catColor, 30));
    grad.addColorStop(1, catColor);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(sp.x, sp.y, r, 0, Math.PI * 2);
    ctx.fill();

    // Border
    ctx.strokeStyle = isSelected ? "#fff" : isHovered ? "rgba(255,255,255,0.5)" : "rgba(255,255,255,0.12)";
    ctx.lineWidth = isSelected ? 2.5 : isHovered ? 2 : 1;
    ctx.stroke();

    // Ring for nodes with companion apps
    if (n.app) {
      ctx.strokeStyle = "rgba(16,185,129," + (0.4 * alpha) + ")";
      ctx.lineWidth = 1.5;
      ctx.setLineDash([3, 3]);
      ctx.beginPath();
      ctx.arc(sp.x, sp.y, r + 5 * camZoom, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // Label
    if (camZoom > 0.4) {
      ctx.fillStyle = "rgba(255,255,255," + (alpha * 0.95) + ")";
      ctx.font = `${Math.max(10, 12 * camZoom)}px Inter, system-ui, sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      const label = n.name;
      const maxW = r * 1.6;
      if (ctx.measureText(label).width > maxW && camZoom < 1.5) {
        // Abbreviate
        const words = label.split(" ");
        const short = words.length > 1 ? words.map(w => w[0]).join("") : label.slice(0, 4);
        ctx.fillText(short, sp.x, sp.y);
      } else {
        ctx.fillText(label, sp.x, sp.y);
      }
    }

    // Full label below
    if (camZoom > 0.6) {
      ctx.fillStyle = "rgba(156,163,175," + (alpha * 0.7) + ")";
      ctx.font = `${Math.max(8, 10 * camZoom)}px Inter, system-ui, sans-serif`;
      ctx.fillText(n.short.length > 30 ? n.short.slice(0, 28) + "..." : n.short, sp.x, sp.y + r + 12 * camZoom);
    }

    ctx.globalAlpha = 1;
  });
}

function lightenColor(hex, amt) {
  let r = parseInt(hex.slice(1,3), 16);
  let g = parseInt(hex.slice(3,5), 16);
  let b = parseInt(hex.slice(5,7), 16);
  r = Math.min(255, r + amt);
  g = Math.min(255, g + amt);
  b = Math.min(255, b + amt);
  return `rgb(${r},${g},${b})`;
}

// ═══════════════════════════════════════════════════════
//  INTERACTION
// ═══════════════════════════════════════════════════════
let dragNode = null;
let isPanning = false;
let panStart = { x: 0, y: 0 };
let mouseX = 0, mouseY = 0;

function getNodeAt(sx, sy) {
  const w = screenToWorld(sx, sy);
  for (let i = nodes.length - 1; i >= 0; i--) {
    const n = nodes[i];
    const dx = w.x - n.x, dy = w.y - n.y;
    if (dx * dx + dy * dy < n.radius * n.radius * 1.5) return n;
  }
  return null;
}

canvas.addEventListener("mousedown", e => {
  const node = getNodeAt(e.clientX, e.clientY);
  if (node) {
    dragNode = node;
    canvas.classList.add("dragging");
  } else {
    isPanning = true;
    panStart = { x: e.clientX, y: e.clientY };
    canvas.classList.add("dragging");
  }
});

canvas.addEventListener("mousemove", e => {
  mouseX = e.clientX;
  mouseY = e.clientY;

  if (dragNode) {
    const w = screenToWorld(e.clientX, e.clientY);
    dragNode.x = w.x;
    dragNode.y = w.y;
    dragNode.vx = 0;
    dragNode.vy = 0;
    return;
  }
  if (isPanning) {
    const dx = e.clientX - panStart.x;
    const dy = e.clientY - panStart.y;
    targetCamX -= dx / camZoom;
    targetCamY -= dy / camZoom;
    panStart = { x: e.clientX, y: e.clientY };
    return;
  }

  const node = getNodeAt(e.clientX, e.clientY);
  if (node && node !== hoveredNode) {
    hoveredNode = node;
    canvas.classList.add("hovering");
    showTooltip(node, e.clientX, e.clientY);
  } else if (!node && hoveredNode) {
    hoveredNode = null;
    canvas.classList.remove("hovering");
    hideTooltip();
  } else if (node) {
    moveTooltip(e.clientX, e.clientY);
  }
});

canvas.addEventListener("mouseup", e => {
  if (dragNode) {
    // If barely moved, treat as click
    dragNode = null;
  }
  if (!isPanning && !dragNode) {
    const node = getNodeAt(e.clientX, e.clientY);
    if (node) {
      selectNode(node);
    } else {
      deselectNode();
    }
  }
  isPanning = false;
  canvas.classList.remove("dragging");
});

canvas.addEventListener("click", e => {
  const node = getNodeAt(e.clientX, e.clientY);
  if (node) {
    selectNode(node);
  }
});

canvas.addEventListener("wheel", e => {
  e.preventDefault();
  const zoomFactor = e.deltaY > 0 ? 0.92 : 1.08;
  targetCamZoom = Math.max(0.2, Math.min(4, targetCamZoom * zoomFactor));

  // Zoom toward mouse
  const w = screenToWorld(e.clientX, e.clientY);
  targetCamX += (w.x - targetCamX) * (1 - 1 / zoomFactor) * 0.3;
  targetCamY += (w.y - targetCamY) * (1 - 1 / zoomFactor) * 0.3;
}, { passive: false });

// Zoom buttons
document.getElementById("zoomIn").onclick = () => targetCamZoom = Math.min(4, targetCamZoom * 1.3);
document.getElementById("zoomOut").onclick = () => targetCamZoom = Math.max(0.2, targetCamZoom * 0.7);
document.getElementById("zoomFit").onclick = () => {
  targetCamX = 0; targetCamY = 0; targetCamZoom = 1;
};

// ═══════════════════════════════════════════════════════
const tooltip = document.getElementById("tooltip");
const tooltipName = document.getElementById("tooltipName");
const tooltipDesc = document.getElementById("tooltipDesc");

function showTooltip(node, x, y) {
  tooltipName.textContent = node.name;
  tooltipDesc.textContent = node.short;
  tooltip.classList.add("visible");
  moveTooltip(x, y);
}
function moveTooltip(x, y) {
  const pad = 16;
  let tx = x + pad, ty = y + pad;
  if (tx + 260 > W) tx = x - 260 - pad;
  if (ty + 80 > H) ty = y - 80 - pad;
  tooltip.style.left = tx + "px";
  tooltip.style.top = ty + "px";
}
function hideTooltip() {
  tooltip.classList.remove("visible");
}

//  DETAIL PANEL
// ═══════════════════════════════════════════════════════
const panel = document.getElementById("detailPanel");

function selectNode(node) {
  selectedNode = node;
  hideTooltip();

  // Animate camera to node
  targetCamX = node.x;
  targetCamY = node.y;
  if (camZoom < 0.8) targetCamZoom = 1;

  // Fill panel
  const catColor = CATEGORY_COLORS[node.category] || "#7C3AED";
  document.getElementById("detailIcon").style.background = `linear-gradient(135deg, ${catColor}, ${lightenColor(catColor, 40)})`;
  document.getElementById("detailIcon").textContent = CATEGORY_ICONS[node.category] || "\u2B50";
  document.getElementById("detailName").textContent = node.name;
  document.getElementById("detailId").textContent = node.id;
  document.getElementById("detailCategory").textContent = node.category;
  document.getElementById("detailCategory").style.background = `${catColor}18`;
  document.getElementById("detailCategory").style.color = catColor;
  document.getElementById("detailCategory").style.borderColor = `${catColor}33`;
  document.getElementById("detailDesc").textContent = node.description;

  // Tags
  const tagsEl = document.getElementById("detailTags");
  tagsEl.innerHTML = node.tags.map(t => `<span class="tag">${t}</span>`).join("");

  // Relations
  const relsEl = document.getElementById("detailRelations");
  const connEdges = edges.filter(e => e.source === node.id || e.target === node.id);
  if (connEdges.length > 0) {
    document.getElementById("detailRelationsSection").style.display = "";
    relsEl.innerHTML = connEdges.map(e => {
      const otherId = e.source === node.id ? e.target : e.source;
      const other = nodeMap[otherId];
      if (!other) return "";
      const otherColor = CATEGORY_COLORS[other.category] || "#7C3AED";
      return `<div class="relation-item" onclick="selectNode(nodeMap['${otherId}'])">
        <span class="relation-dot" style="background:${otherColor}"></span>
        <span class="relation-name">${other.name}</span>
        <span class="relation-type">${e.type}</span>
      </div>`;
    }).join("");
  } else {
    document.getElementById("detailRelationsSection").style.display = "none";
  }

  // Companion app
  const appSection = document.getElementById("detailAppSection");
  if (node.app) {
    appSection.style.display = "";
    document.getElementById("detailApp").innerHTML = `
      <div class="companion-app">
        <div class="companion-app-icon">\u{1F4E6}</div>
        <div>
          <div class="companion-app-name">${node.app.id}</div>
          <div class="companion-app-desc">${node.app.desc}</div>
        </div>
      </div>`;
  } else {
    appSection.style.display = "none";
  }

  // Scripts
  const scriptsSection = document.getElementById("detailScriptsSection");
  if (node.scripts && node.scripts.length > 0) {
    scriptsSection.style.display = "";
    document.getElementById("detailScripts").innerHTML = node.scripts.map(s => `<div class="script-item">${s}</div>`).join("");
  } else {
    scriptsSection.style.display = "none";
  }

  panel.classList.add("open");
}

function deselectNode() {
  selectedNode = null;
  panel.classList.remove("open");
}

document.getElementById("detailClose").onclick = deselectNode;

// ═══════════════════════════════════════════════════════
//  LEGEND + FILTERS
// ═══════════════════════════════════════════════════════
const legendEl = document.getElementById("legend");
const filterBar = document.getElementById("filterBar");
let activeFilter = "all";

Object.entries(CATEGORY_COLORS).forEach(([cat, color]) => {
  // Legend
  const item = document.createElement("div");
  item.className = "legend-item";
  item.innerHTML = `<span class="legend-dot" style="background:${color}"></span>${cat}`;
  item.onclick = () => setFilter(cat);
  legendEl.appendChild(item);

  // Filter pill
  const pill = document.createElement("button");
  pill.className = "filter-pill";
  pill.dataset.filter = cat;
  pill.textContent = cat.split(" ")[0]; // First word
  pill.onclick = () => setFilter(cat);
  filterBar.appendChild(pill);
});

// Edge legend
const edgeLegendDiv = document.createElement("div");
edgeLegendDiv.className = "legend-edges";
edgeLegendDiv.innerHTML = `
  <div class="legend-edge"><span class="legend-line" style="background:rgba(59,130,246,0.6)"></span>Pipeline</div>
  <div class="legend-edge"><span class="legend-line" style="background:rgba(124,58,237,0.5)"></span>Complement</div>
  <div class="legend-edge"><span class="legend-line dashed" style="color:rgba(245,158,11,0.7)"></span>Sibling</div>
  <div class="legend-edge"><span class="legend-line dashed" style="color:rgba(236,72,153,0.6)"></span>Shared Core</div>
`;
legendEl.appendChild(edgeLegendDiv);

function setFilter(cat) {
  if (activeFilter === cat) {
    activeFilter = "all";
  } else {
    activeFilter = cat;
  }

  // Update pills
  filterBar.querySelectorAll(".filter-pill").forEach(p => {
    p.classList.toggle("active", p.dataset.filter === activeFilter);
  });

  // Update legend
  legendEl.querySelectorAll(".legend-item").forEach(item => {
    const text = item.textContent;
    item.classList.toggle("dimmed", activeFilter !== "all" && text !== activeFilter);
  });

  // Update node visibility
  nodes.forEach(n => {
    n.highlight = (activeFilter === "all" || n.category === activeFilter) ? 1 : 0.1;
  });

  deselectNode();
}

// ═══════════════════════════════════════════════════════
//  SEARCH
// ═══════════════════════════════════════════════════════
const searchInput = document.getElementById("searchInput");
searchInput.addEventListener("input", () => {
  const q = searchInput.value.toLowerCase().trim();
  if (!q) {
    nodes.forEach(n => n.highlight = activeFilter === "all" || n.category === activeFilter ? 1 : 0.1);
    return;
  }
  nodes.forEach(n => {
    const match = n.name.toLowerCase().includes(q) ||
                  n.id.includes(q) ||
                  n.tags.some(t => t.includes(q)) ||
                  n.category.toLowerCase().includes(q);
    n.highlight = match ? 1 : 0.08;
  });

  // Focus first match
  const firstMatch = nodes.find(n => n.highlight === 1);
  if (firstMatch) {
    targetCamX = firstMatch.x;
    targetCamY = firstMatch.y;
  }
});

// Keyboard shortcut
document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    deselectNode();
    searchInput.blur();
    searchInput.value = "";
    nodes.forEach(n => n.highlight = activeFilter === "all" || n.category === activeFilter ? 1 : 0.1);
  }
  if (e.key === "/" && document.activeElement !== searchInput) {
    e.preventDefault();
    searchInput.focus();
  }
});

// ═══════════════════════════════════════════════════════
//  MAIN LOOP
// ═══════════════════════════════════════════════════════
function loop() {
  simulate();
  spawnEdgeParticles();
  updateParticles();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
